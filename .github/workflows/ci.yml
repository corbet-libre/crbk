name: ci
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - name: Resolve one fresh dependency snapshot
      run: |-
        cargo update
        rustc --version > resolver.txt
        cargo --version >> resolver.txt
        date -u +%FT%TZ >> resolver.txt
        sha256sum Cargo.lock >> resolver.txt
    - uses: actions/upload-artifact@v4
      with:
        name: resolved-lock
        path: |-
          Cargo.lock
          resolver.txt
        retention-days: 7
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
    - run: rustc --version
    - name: Check dependency pins
      run: |-
        python3 .github/check-first-party.py
        node --test .github/check-pins.test.mjs
        cargo metadata --locked --all-features --format-version 1 > dependency-metadata.json
    - run: cargo fmt --all --check
    - run: cargo clippy --locked --all-targets -- -D warnings
    - run: cargo test --locked
    - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
    - run: cargo test --locked --no-default-features
    - run: cargo check --locked --no-default-features --target wasm32-unknown-unknown
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install matching wasm test runner
      shell: bash
      run: |-
        version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
        archive="wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz"
        base="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}"
        mkdir -p "$RUNNER_TEMP/crbk-wasm-runner"
        cd "$RUNNER_TEMP/crbk-wasm-runner"
        curl --user-agent dependency-ci --fail --location --retry 3 --remote-name "$base/$archive"
        curl --user-agent dependency-ci --fail --location --retry 3 --remote-name "$base/$archive.sha256sum"
        checksum=$(cut -d ' ' -f1 "$archive.sha256sum")
        printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check
        tar -xzf "$archive" --strip-components=1
        echo "$PWD" >> "$GITHUB_PATH"
    - name: Execute identical policy vectors on wasm32
      env:
        CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
      run: cargo test --locked --no-default-features --target wasm32-unknown-unknown --test policies --test settings
        --test membership
    needs:
    - resolve
  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - run: python3 .github/check-first-party.py
    - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
      with:
        tool: cargo-deny
    - run: cargo deny --locked check advisories
    needs:
    - resolve
  coverage:
    needs:
    - resolve
    - check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: coverage
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
    - run: |-
        rustc --version
        cargo llvm-cov --version
    - name: Measure real native round trips and failure paths
      run: cargo llvm-cov --locked --workspace --all-features --branch --no-cfg-coverage --no-cfg-coverage-nightly
        --ignore-filename-regex '/tests/' --json --output-path coverage.json
    - name: Require complete line and branch coverage
      run: python3 .github/check-coverage.py coverage.json
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage
        path: |-
          coverage.json
          Cargo.lock
          resolver.txt
        retention-days: 7
'on':
  push:
    branches:
    - '**'
    paths-ignore:
    - '**.md'
    - LICENSE
    - LICENSES/**
  pull_request: null
  workflow_dispatch: null
env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always
