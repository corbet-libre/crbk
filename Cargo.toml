[package]
name = "crbk"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Rulebook: sparse layered settings and the decisions on them"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-foss/crbk"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[features]
default = ["sql"]
sql = ["dep:crlt"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crlt = { git = "https://git.corbet.ch/corbet-foss/crlt", branch = "main", optional = true }

[dependencies]
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[[test]]
name = "storage"
required-features = ["sql"]

[[test]]
name = "turso"
required-features = ["sql"]
